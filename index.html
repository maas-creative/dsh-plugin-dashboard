<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0017c1"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><title>Project Dashboard — 作業と締切</title><script src="/marked.umd.js" defer></script><script src="/app.js" defer></script></head><body>
<a class="skip-link" href="#main">本文へ移動</a>
<div id="login" class="login"><div class="brandmark">P<span>•</span></div><h1>作業の続きが、ここに。</h1><p>Project Dashboard</p><form id="login-form"><label>Macの接続キー／スマホ接続コード<input name="code" type="password" autocomplete="off" required></label><button>接続する</button></form><p id="login-error" role="alert"></p><small>Mac上のセッションと締切を、安全に確認します。</small></div>
<div id="shell" hidden><aside><a class="brand" href="/">P<span>•</span><strong>Project<br>Dashboard</strong></a><p class="nav-label">ワークスペース</p><nav aria-label="メインメニュー"><button data-view="portfolio" class="selected">全体の進捗</button><button data-view="daily">今日のエージェント</button><button data-view="overview">今日のタスク</button><button data-view="projects">プロジェクト</button><button data-view="deadlines">締切と提出</button><button data-view="sessions">エージェント</button><button data-view="manager">履歴からの整理</button><button data-view="settings">接続・通知</button></nav><div class="sidebar-note"><span class="status-dot"></span> このMacで管理<br><small>作業・成果物・提出の記録</small></div></aside>
<main id="main" tabindex="-1"><header><div><p class="eyebrow" id="today"></p><h1 id="page-title">全体の進捗</h1></div><div class="header-actions"><button class="ghost" id="refresh">更新</button><button id="new-project">＋ プロジェクト</button></div></header>
<div id="health" class="health" role="status"></div><div id="toast" role="status" hidden></div><div id="content"></div><footer>Project Dashboard <span>このMacに保存 · 作業完了と提出受付を区別</span></footer></main></div>
<dialog id="editor" aria-labelledby="dialog-title"><form id="edit-form"><div class="dialog-head"><h2 id="dialog-title"></h2><button type="button" class="icon ghost" id="close-dialog" aria-label="閉じる">×</button></div><div id="fields"></div><p id="form-error" role="alert"></p><div class="dialog-actions"><div id="pi-question-actions" hidden></div><button type="button" class="ghost" id="cancel-dialog">キャンセル</button><button type="submit">保存する</button></div></form></dialog>
</body></html>
